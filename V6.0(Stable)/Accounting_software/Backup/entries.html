<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounting Program</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">    

    <h1>Create New Entry</h1>


    <form action="add_entry.php" method="post">
        <label for="customer">Customer:</label>
        <input type="text" name="customer" id="customer" required>
        <br>
        <label for="product">Product:</label>
        <input type="text" name="product" id="product" required>
        <br>
        <label for="price">Price:</label>
        <input type="number" name="price" id="price" required>
        <br>
        <label for="quantity">Quantity:</label>
        <input type="number" name="quantity" id="quantity" required>
        <br>
        <label for="our_cost">Our Cost:</label>
        <input type="number" name="our_cost" id="our_cost" required>
        <br>
        <label for="channel">Channel:</label>
        <input type="text" name="channel" id="channel" required>
        <br>
        <label for="amount_received">Amount Received:</label>
        <input type="number" id="amount_received" name="amount_received" required><br><br>
        <button type="submit" class="button">Create Entry</button>
    </form>

    <h2>Show Account Details Of:</h2>
    <input type="text" id="customer_name" placeholder="Enter customer name">
    <button type="button" class="button" onclick="showAccountDetails()">Show Details</button>
    <div id="account_details_container"></div>
    <script src="backend.js"></script>
</div>
<script src="scripts.js"></script>
</body>
</html>
