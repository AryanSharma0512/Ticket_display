<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounting Program</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Create New Entry</h1>
    <form action="add_entry.php" method="post">
        <label for="customer">Customer:</label>
        <input type="text" name="customer" id="customer" required><br>
        <label for="product">Product:</label>
        <input type="text" name="product" id="product" required><br>
        <label for="price">Price:</label>
        <input type="number" name="price" id="price" required><br>
        <label for="quantity">Quantity:</label>
        <input type="number" name="quantity" id="quantity" required><br>
        <label for="our_cost">Our Cost:</label>
        <input type="number" name="our_cost" id="our_cost" required><br>
        <label for="channel">Channel:</label>
        <input type="text" name="channel" id="channel" required><br>
        <label for="amount_received">Amount Received:</label>
        <input type="number" name="amount_received" id="amount_received" required><br><br>
        <button type="submit" class="button">Create Entry</button>
    </form>
</div>

<div class="container">
    <h2>Create Account Network Entry</h2>
    <form action="add_acc_network_entry.php" method="post">
        <label for="accountHolder">Account Holder:</label>
        <input type="text" name="accountHolder" id="accountHolder" required><br>
        <label for="productCategory">Product Category:</label>
        <select name="productCategory" id="productCategory" required>
            <option value="Ticket" selected>Ticket</option>
            <option value="Hotel">Hotel</option>
            <option value="Train">Train</option>
            <option value="Others">Others</option>
        </select><br>
        <label for="amountUsed">Amount Used:</label>
        <input type="number" name="amountUsed" id="amountUsed" required readonly><br>
        <label for="amountPaid">Amount Paid:</label>
        <input type="number" name="amountPaid" id="amountPaid" value="0" required><br>
        <label for="transactionID">Transaction ID:</label>
        <input type="text" name="transactionID" id="transactionID" required><br><br>
        <button type="submit" class="button">Create Acc Entry</button>
    </form>
    <form action="reset_ids_acc.php" method="get">
        <input type="hidden" name="recalculate" value="true">
        <button type="submit" class="button">Reset IDs and Recalculate Data</button>
    </form>
</div>

<div class="container">
    <h2>Show Account Details Of:</h2>
    <label for="searchCriteria">Search By:</label>
    <select id="searchCriteria">
        <option value="customerName" selected>Customer Name</option>
        <option value="customerID">Customer ID</option>
        <option value="transactionID">Transaction ID</option>
    </select>
    <input type="text" id="searchQuery" placeholder="Enter value"><br>
    <button type="button" class="button" onclick="showAccountDetails()">Show Details</button>
    <button type="button" class="button" onclick="exportAccountDetails()">Export</button>
    <button type="button" class="button" onclick="promptResetIDs()">Reset IDs</button>
    <div id="account_details_container"></div>
</div>

<script>
    // Function to fetch and display account details
    function showAccountDetails() {
        const criteria = document.getElementById("searchCriteria").value;
        const query = document.getElementById("searchQuery").value.trim();
        const detailsContainer = document.getElementById("account_details_container");

        if (!query) {
            detailsContainer.innerHTML = "<p>Please enter a value to search.</p>";
            return;
        }

        let url = "";
        if (criteria === "customerName") {
            url = `get_account_details.php?customer_name=${encodeURIComponent(query)}`;
        } else if (criteria === "customerID") {
            url = `get_account_details.php?customer_id=${encodeURIComponent(query)}`;
        } else if (criteria === "transactionID") {
            url = `get_account_details.php?transaction_id=${encodeURIComponent(query)}`;
        }

        detailsContainer.innerHTML = "<p>Loading data...</p>";
        fetch(url)
            .then(response => response.text())
            .then(data => {
                detailsContainer.innerHTML = data;
            })
            .catch(error => {
                detailsContainer.innerHTML = `<p>Error fetching details: ${error}</p>`;
            });
    }

    // Copy Our Cost to Amount Used when Our Cost changes
    document.getElementById('our_cost').addEventListener('change', function() {
        document.getElementById('amountUsed').value = this.value;
    });

    // Export and Reset functions
    function exportAccountDetails() {
        const customerName = document.getElementById("searchQuery").value.trim();
        if (customerName === "") {
            alert("Please enter a customer name before exporting.");
            return;
        }
        window.location.href = `export_account_details.php?customer=${encodeURIComponent(customerName)}`;
    }

    function promptResetIDs() {
        const userChoice = confirm("Do you want to recalculate dependent fields as well? Press OK for Yes or Cancel for No.");
        if (userChoice) {
            fetch("reset_ids.php?recalculate=true")
                .then(response => response.text())
                .then(data => alert(data))
                .catch(error => alert("Error resetting IDs: " + error));
        } else {
            fetch("reset_ids.php?recalculate=false")
                .then(response => response.text())
                .then(data => alert(data))
                .catch(error => alert("Error resetting IDs: " + error));
        }
    }
</script>
<script src="script.js"></script>
</body>
</html>
