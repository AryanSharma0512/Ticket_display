<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style2.css">
  <title>Flight Options</title>
</head>
<body>
  <header class="clearfix">
    <h1 class="ticket-heading">Flight Options</h1>
    <img src="elements/Logo.png" alt="Logo" class="logo">
  </header>
  <main class="container">
    <div class="ticket-wrapper">
      <div id="options">
        
      <div class="option">
        <h2>Option 1</h2>
        <p><strong>Date of Journey:</strong> Sun, 27 July 2025</p>
        <div class="cities">
          <span class="from">From:</span><span class="city"> Johannesburg</span>
          <img src="elements/line.png" alt="line" class="line-icon"><img src="elements/plane.png" alt="Plane" class="plane-icon"><img src="elements/line.png" alt="line" class="line-icon">
          <span class="to">To: </span><span class="city">Delhi</span>
        </div>
        <p><span class="time">&emsp;&emsp;&ensp;09:50</span>&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&ensp;&emsp;&emsp;&emsp;<span class="ftime">13h 55min</span>&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;<span class="time">03:15</span></p>
        <br><br>
        <p><strong>Number Of Stops:</strong> 1 (Layover at Abu Dhabi for 2h 25min)</p>
        <p><strong>Airline Name:</strong> Etihad</p>
        <p><strong>Flight Fare:</strong> 42000 <strong>INR</strong> (Per Passenger)</p>
      </div>
    
      </div>
    </div>
    </div>
  </main>
  <footer class="clearfix">
        <p>&copy; Shree Dhanlaxmi Travels 2024 - 2025</p>
    </footer>
</body>
</html>
