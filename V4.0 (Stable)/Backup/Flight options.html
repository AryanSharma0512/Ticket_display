<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style2.css">
  <title>Flight Options</title>
</head>
<body>
  <header class="clearfix">
    <h1 class="ticket-heading">Flight Options</h1>
    <img src="logo.png" alt="Logo" class="logo">
  </header>
  <main class="container">
    <div class="ticket-wrapper">
      <div id="options">
        
      <div class="option">
        <h2>Option 1</h2>
        <p><strong>Date of Journey:</strong> Fri, 5 July, 2024</p>
        <div class="cities">
          <span class="from">From:</span><span class="city"> -</span>
          <img src="line.png" alt="line" class="line-icon"><img src="plane.png" alt="Plane" class="plane-icon"><img src="line.png" alt="line" class="line-icon">
          <span class="to">To: </span><span class="city">-</span>
        </div>
        <p><span class="time">&emsp;&emsp;&ensp;-</span>&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&ensp;&emsp;&emsp;&emsp;<span class="ftime">-</span>&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;<span class="time">-</span></p>
        <br><br>
        <p><strong>Number Of Stops:</strong> -</p>
        <p><strong>Airline Name:</strong> -</p>
        <p><strong>Flight Fare:</strong> - <strong>INR</strong> (Per Passenger)</p>
      </div>
    
      </div>
    </div>
    </div>
  </main>
  <footer class="clearfix">
        <p>&copy; Shree Dhanlaxmi Travels 2024</p>
    </footer>
</body>
</html>
