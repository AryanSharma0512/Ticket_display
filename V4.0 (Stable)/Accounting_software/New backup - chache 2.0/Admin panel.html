<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="admin_style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <!-- Include Chart.js -->
</head>
<body>
    <!-- Header Section -->
    <header class="header">
        <h1>Admin Panel</h1>
        <p>Welcome to the Dhanlaxmi Travels Admin Dashboard</p>
    </header>

    <!-- Main Container -->
    <div class="actions">
        <!-- Dropdown Menu -->
        <label for="adminActions">What would you like to do?</label>
        <select id="adminActions" onchange="handleAction()" class="dropdown">
            <option value="" selected disabled>-- Select an action --</option>
            <option value="incomeStatement">Income Statement</option>
            <option value="paymentDue">Outstanding Payments</option>
            <option value="outstandingChart">Outstanding Payments by Customer</option>
            <option value="monthlyRevenue">Monthly Revenue Trends</option>
            <option value="customerRevenue">Customer Contribution to Revenue</option>
            <option value="yearToDate">Year-to-Date Performance</option>
            <option value="universalAggregates">Universal Aggregated Fields</option>
        </select>

        <!-- Export Buttons -->
        <div id="exportContainer" class="export-container" style="display: none;">
            <button id="exportPdf" class="button" onclick="exportPDF()">Export as PDF</button>
            <button id="exportCsv" class="button" onclick="exportCSV()">Export as CSV</button>
        </div>

        <!-- Output Area -->
        <div id="outputContainer" class="centered">
            Please select an action from the dropdown above.
        </div>

        <!-- Chart Container -->
        <div id="chartContainer" style="display: none; margin-top: 20px;">
            <canvas id="chartCanvas"></canvas>
        </div>
    </div>

    <!-- Footer Section -->
    <footer class="footer">
        <p>
            &copy; 2025 Dhanlaxmi Travels Ltd.
            <span class="tooltip">Designed in-house by <span>Aryan Sharma</span></span>
        </p>
    </footer>

    <!-- JavaScript Section -->
    <script>
        let currentAction = ''; // Store the current selected action
        let activeChart = null; // Track the currently active Chart.js instance

        // Handle dropdown actions
        function handleAction() {
            const action = document.getElementById("adminActions").value;
            const outputContainer = document.getElementById("outputContainer");
            const exportContainer = document.getElementById("exportContainer");
            const chartContainer = document.getElementById("chartContainer");

            outputContainer.innerHTML = ''; // Clear previous output
            exportContainer.style.display = "none"; // Hide export buttons initially
            chartContainer.style.display = "none"; // Hide chart container initially
            currentAction = action; // Update the current action

            switch (action) {
                case "incomeStatement":
                    fetchIncomeStatement();
                    break;
                case "paymentDue":
                    fetchOutstandingPayments();
                    break;
                case "outstandingChart":
                    fetchAndRenderChart("fetch_outstanding_payments.php", "Outstanding Payments by Customer", "bar", "Customer Name", "Outstanding Amount (INR)");
                    break;
                case "monthlyRevenue":
                    fetchAndRenderChart("fetch_monthly_revenue.php", "Monthly Revenue Trends", "line", "Month", "Revenue (INR)");
                    break;
                case "customerRevenue":
                    fetchAndRenderChart("fetch_customer_revenue.php", "Customer Contribution to Revenue", "pie", "Customer Name", "Revenue (INR)");
                    break;
                case "yearToDate":
                    fetchYearToDatePerformance();
                    break;
                case "universalAggregates":
                    fetchUniversalAggregatedFields();
                    break;
                default:
                    outputContainer.innerHTML = 'Please select an action from the dropdown above.';
            }
        }

        // Dynamically set PDF export link
        function exportPDF() {
            if (currentAction === "incomeStatement") {
                window.location.href = "generate_income_statement_pdf.php"; // PDF for Income Statement
            } else if (currentAction === "paymentDue") {
                window.location.href = "generate_outstanding_pdf.php"; // PDF for Outstanding Payments
            } else if (currentAction === "outstandingChart") {
                alert("PDF export for Outstanding Payments by Customer is not available yet.");
            } else if (currentAction === "monthlyRevenue") {
                window.location.href = "generate_monthly_revenue_pdf.php"; // PDF for Monthly Revenue Trends
            } else if (currentAction === "customerRevenue") {
                window.location.href = "generate_customer_revenue_pdf.php"; // PDF for Customer Contribution to Revenue
            } else if (currentAction === "yearToDate") {
                window.location.href = "generate_year_to_date_pdf.php"; // PDF for Year-to-Date Performance
            } else {
                alert("Please select a valid action to export.");
            }
        }

        // Dynamically set CSV export link
        function exportCSV() {
            if (currentAction === "incomeStatement") {
                window.location.href = "generate_income_statement_csv.php"; // CSV for Income Statement
            } else if (currentAction === "paymentDue") {
                window.location.href = "generate_outstanding_csv.php"; // CSV for Outstanding Payments
            } else if (currentAction === "outstandingChart") {
                alert("CSV export for Outstanding Payments by Customer is not available yet.");
            } else if (currentAction === "monthlyRevenue") {
                window.location.href = "generate_monthly_revenue_csv.php"; // CSV for Monthly Revenue Trends
            } else if (currentAction === "customerRevenue") {
                window.location.href = "generate_customer_revenue_csv.php"; // CSV for Customer Contribution to Revenue
            } else if (currentAction === "yearToDate") {
                window.location.href = "generate_year_to_date_csv.php"; // CSV for Year-to-Date Performance
            } else {
                alert("Please select a valid action to export.");
            }
        }

        // Fetch and display Income Statement
        function fetchIncomeStatement() {
            const outputContainer = document.getElementById("outputContainer");
            outputContainer.innerHTML = '<p>Loading Income Statement...</p>';

            fetch("generate_income_statement.php")
                .then(response => response.text())
                .then(data => {
                    outputContainer.innerHTML = data;
                    document.getElementById("exportContainer").style.display = "block";
                })
                .catch(error => {
                    outputContainer.innerHTML = `<p>Error generating income statement: ${error.message}</p>`;
                });
        }

        // Fetch and display Outstanding Payments
        function fetchOutstandingPayments() {
            const outputContainer = document.getElementById("outputContainer");
            outputContainer.innerHTML = '<p>Loading Outstanding Payments...</p>';

            fetch("fetch_outstanding_payments.php")
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        outputContainer.innerHTML = `<p>${data.error}</p>`;
                        return;
                    }

                    if (data.length === 0) {
                        outputContainer.innerHTML = '<p>No outstanding payments found.</p>';
                        return;
                    }

                    let tableHTML = `
                        <h2>Outstanding Payments</h2>
                        <table border="1" style="border-collapse: collapse; width: 100%; text-align: left;">
                            <tr>
                                <th>Customer ID</th>
                                <th>Customer Name</th>
                                <th>Outstanding Amount</th>
                            </tr>
                    `;

                    let totalOutstanding = 0;

                    data.forEach(row => {
                        tableHTML += `
                            <tr>
                                <td>${row.customer_id}</td>
                                <td>${row.customer_name}</td>
                                <td>${row.outstanding_amount.toFixed(2)}</td>
                            </tr>
                        `;
                        totalOutstanding += parseFloat(row.outstanding_amount);
                    });

                    tableHTML += `
                            <tr>
                                <td colspan="2"><strong>Total Outstanding</strong></td>
                                <td><strong>${totalOutstanding.toFixed(2)}</strong></td>
                            </tr>
                        </table>
                    `;

                    outputContainer.innerHTML = tableHTML;
                    document.getElementById("exportContainer").style.display = "block";
                })
                .catch(error => {
                    outputContainer.innerHTML = `<p>Error fetching data: ${error.message}</p>`;
                });
        }

        // Fetch and render a Chart.js chart
        function fetchAndRenderChart(apiUrl, chartTitle, chartType, xLabel, yLabel) {
            const chartContainer = document.getElementById("chartContainer");
            chartContainer.style.display = "block";

            fetch(apiUrl)
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        document.getElementById("outputContainer").innerHTML = `<p>${data.error}</p>`;
                        return;
                    }

                    const labels = data.map(row => row.customer_name || row.month);
                    const dataset = data.map(row => row.total_sales || row.outstanding_amount);

                    // Destroy the previous chart if it exists
                    if (activeChart) {
                        activeChart.destroy();
                    }

                    const ctx = document.getElementById("chartCanvas").getContext("2d");
                    activeChart = new Chart(ctx, {
                        type: chartType,
                        data: {
                            labels: labels,
                            datasets: [{
                                label: yLabel,
                                data: dataset,
                                backgroundColor: "rgba(54, 162, 235, 0.2)",
                                borderColor: "rgba(54, 162, 235, 1)",
                                borderWidth: 1
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: {
                                title: {
                                    display: true,
                                    text: chartTitle
                                }
                            },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    title: {
                                        display: true,
                                        text: yLabel
                                    }
                                },
                                x: {
                                    title: {
                                        display: true,
                                        text: xLabel
                                    }
                                }
                            }
                        }
                    });
                })
                .catch(error => {
                    document.getElementById("outputContainer").innerHTML = `<p>Error fetching data: ${error.message}</p>`;
                });
        }

        // Fetch and display Year-to-Date Performance
        function fetchYearToDatePerformance() {
            const outputContainer = document.getElementById("outputContainer");

            fetch("fetch_year_to_date.php")
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        outputContainer.innerHTML = `<p>${data.error}</p>`;
                        return;
                    }

                    const { net_sales, net_profit } = data;

                    outputContainer.innerHTML = `
                        <h2>Year-to-Date Performance</h2>
                        <table border="1" style="border-collapse: collapse; width: 100%; text-align: left;">
                            <tr>
                                <th>Net Sales</th>
                                <td>INR ${net_sales.toFixed(2)}</td>
                            </tr>
                            <tr>
                                <th>Net Profit</th>
                                <td>INR ${net_profit.toFixed(2)}</td>
                            </tr>
                        </table>
                    `;
                })
                .catch(error => {
                    outputContainer.innerHTML = `<p>Error fetching data: ${error.message}</p>`;
                });
        }


        function fetchUniversalAggregatedFields() {
            const outputContainer = document.getElementById("outputContainer");
            outputContainer.innerHTML = '<p>Loading aggregate data...</p>';

            fetch('fetch_aggregates.php')
            .then(response => response.json())
            .then(data => {
                if(data.success) {
                    
                    const results = `
                        <h3>Aggregated Financial Metrics</h3>
                        <table class="aggregated-metrics">
                           <tr>
                              <th>Net Sales</th>
                              <td>${data.net_collectable}</td>
                           </tr>
                           <tr>
                              <th>Net Amount Received</th>
                              <td>${data.net_amount_received}</td>
                           </tr>
                           <tr>
                              <th>Total Collection Due</th>
                              <td>${data.total_collection_due}</td>
                           </tr>
                           <tr>
                              <th>Total Profit</th>
                              <td>${data.total_profit}</td>
                           </tr>
                           <tr>
                              <th>Net Margin</th>
                              <td>${data.net_margin}%</td>
                           </tr>
                        </table>
                    `;
                    outputContainer.innerHTML = results;
                } else {
                    outputContainer.innerHTML = `Error: ${data.message}`;
                }
            })
            .catch(error => {
                console.error('Error fetching aggregate data:', error);
                outputContainer.innerHTML = 'Error fetching data.';
            });
        }
    </script>
</body>
</html>
