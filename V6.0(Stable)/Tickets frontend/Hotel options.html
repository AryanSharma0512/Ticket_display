<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style2.css">
  <title>Hotel Options</title>
</head>
<body>
  <header class="clearfix">
    <h1 class="ticket-heading">Hotel Options</h1>
    <img src="elements/Logo.png" alt="Logo" class="logo">
  </header>
  <main class="container">
    <div class="ticket-wrapper">
      <div id="options">
        
            <div class="option">
                <h2>Option 1 : Hotel O Gks Residency</h2>
                <p><strong>Date of Checkin:</strong> Sat, 4 January, 2025</p>
                <div class="cities">
                    <span class="from">From:</span><span class="city"> 4/1/2025</span>
                    <img src="elements/line.png" alt="line" class="line-icon"><img src="elements/line.png" alt="line" class="line-icon">
                    <span class="to">To: </span><span class="city">5/1/2025</span>
                </div>
                <br>
                <p><strong>Number Of Adults:</strong> 2</p>
                <p><strong>Hotel Fare:</strong> 1100 <strong>INR</strong> (For 1 Room(s), 1 Night(s) - Inclusive of all taxes and charges.)</p>
                <p><strong>Services Included:</strong> Free Wifi</p>
            </div>
        
      </div>
    </div>
  </main>
  <footer class="clearfix">
        <p>&copy; Shree Dhanlaxmi Travels 2024</p>
    </footer>
</body>
</html>
