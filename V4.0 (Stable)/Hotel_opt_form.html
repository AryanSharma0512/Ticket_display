<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style2.css">
  <title>Hotel Options Form</title>
  <style>
    body {
      font-family: 'Roboto Mono', monospace;
      background-color: #0A1931;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      max-width: 600px;
      padding: 40px;
      background-color: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
      position: relative;
      overflow: auto;
      max-height: calc(100vh - 80px);
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
    }

    form {
      margin-top: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-size: 18px;
    }

    input[type="text"],
    input[type="number"],
    input[type="date"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border: 2px solid #1BFFFF;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 16px;
      background-color: rgba(255, 255, 255, 0.8);
      font-family: 'Roboto Mono', monospace;
      font-weight: bold;
    }

    button[type="submit"] {
      background: linear-gradient(135deg, #2E3192, #1BFFFF);
      color: white;
      padding: 14px 20px;
      margin: 8px 0;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
      transition: background 0.3s;
      font-family: 'Roboto Mono', monospace;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Hotel Options Form</h1>
    <form action="/submit-options" method="POST">
      <label for="num-options">Number of Options:</label>
      <input type="number" id="num-options" name="numOptions" min="1" max="3" required>

      <div id="option-details">
        <!-- Option details will be inserted here dynamically -->
      </div>

      <button type="submit">Submit</button>
    </form>

    <!-- Add a button for reverting to base options -->
    <form action="/revert-options" method="GET">
        <button type="submit">Revert to Base Options</button>
      </form>
  </div>

  <script>
    const numOptionsInput = document.getElementById('num-options');
    const optionDetails = document.getElementById('option-details');

    function generateOptionFields(num) {
      optionDetails.innerHTML = '';

      for (let i = 1; i <= num; i++) {
        const optionSection = document.createElement('div');
        optionSection.classList.add('option-section');

        optionSection.innerHTML = `

          <label for="Name-${i}">Hotel Name for Option ${i}:</label>
          <input type="text" id="Hname-${i}" name="Hname[]" required>

          <label for="date-${i}">Check-in Date for Option ${i}:</label>
          <input type="date" id="checkin-date-${i}" name="checkinDates[]" required>

          <label for="checkout-date-${i}">Check-out Date for Option ${i}:</label>
          <input type="date" id="checkout-date-${i}" name="checkoutDates[]" required>

          <label for="flight-stops-${i}">Number of Adults for Option ${i}:</label>
          <input type="text" id="flight-stops-${i}" name="flightStops[]" required>

          <label for="roomno-${i}">Number of Rooms for Option ${i}:</label>
          <input type="text" id="roomno-${i}" name="roomno[]" required>

          <label for="airline-name-${i}">Services Included for Option ${i}:</label>
          <input type="text" id="airline-name-${i}" name="airlineNames[]" required>

          <label for="flight-fare-${i}">Hotel Fare for Option ${i}:</label>
          <input type="text" id="flight-fare-${i}" name="flightFares[]" required>
        `;

        optionDetails.appendChild(optionSection);
      }
    }

    numOptionsInput.addEventListener('change', () => {
      const numOptions = parseInt(numOptionsInput.value);
      generateOptionFields(numOptions);
    });

    generateOptionFields(1);
  </script>
</body>
</html>
