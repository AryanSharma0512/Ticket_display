<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background with Triangles</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }

        .triangle-background {
            position: fixed;
            width: 100%;
            height: 100%;
            background-image: url('Tri.png');
            background-repeat: no-repeat;
            background-size: auto;
            pointer-events: none;
        }

        .triangle1 {
            position: absolute;
            top: 100px;
            left: 100px;
            width: 50px; /* Adjust width as needed */
            height: 50px; /* Adjust height as needed */
        }

        .triangle2 {
            position: absolute;
            top: 200px;
            left: 300px;
            width: 50px; /* Adjust width as needed */
            height: 50px; /* Adjust height as needed */
        }

        .triangle3 {
            position: absolute;
            top: 400px;
            left: 200px;
            width: 50px; /* Adjust width as needed */
            height: 50px; /* Adjust height as needed */
        }

        .triangle4 {
            position: absolute;
            top: 500px;
            left: 400px;
            width: 50px; /* Adjust width as needed */
            height: 50px; /* Adjust height as needed */
        }
    </style>
</head>
<body>
    <div class="triangle-background">
        <div class="triangle1"></div>
        <div class="triangle2"></div>
        <div class="triangle3"></div>
        <div class="triangle4"></div>
    </div>
    <!-- Your content goes here -->
</body>
</html>
